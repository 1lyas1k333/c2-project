services:
  # C2-сервер
  server:
    build: .
    container_name: c2-server
    ports:
      - "8080:8080"
    networks:
      - c2-network
    command: ["./bin/c2-server"]
    restart: unless-stopped
    environment:
      - JWT_SECRET=your-256-bit-secret-key-for-jwt-signing

  # Клиент 1
  client1:
    build: .
    container_name: c2-client-001
    networks:
      - c2-network
    command: ["./bin/client", "-id", "client-001"]
    depends_on:
      - server
    restart: unless-stopped
    environment:
      - JWT_SECRET=your-256-bit-secret-key-for-jwt-signing

  # Клиент 2
  client2:
    build: .
    container_name: c2-client-002
    networks:
      - c2-network
    command: ["./bin/client", "-id", "client-002"]
    depends_on:
      - server
    restart: unless-stopped
    environment:
      - JWT_SECRET=your-256-bit-secret-key-for-jwt-signing

  # Терминал (интерактивный режим)
  terminal:
    build: .
    container_name: c2-terminal
    networks:
      - c2-network
    command: ["./bin/terminal"]
    depends_on:
      - server
    stdin_open: true
    tty: true
    restart: unless-stopped
    environment:
      - JWT_SECRET=your-256-bit-secret-key-for-jwt-signing

networks:
  c2-network:
    driver: bridge